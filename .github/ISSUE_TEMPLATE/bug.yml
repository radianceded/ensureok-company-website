name: Bug 报告
description: 报告可复现的问题
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 发生了什么？期望结果是什么？
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 点击……
        3. 观察……
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      placeholder: Windows 11 / Chrome 版本 / Node.js 版本
  - type: textarea
    id: evidence
    attributes:
      label: 截图、录屏或日志
